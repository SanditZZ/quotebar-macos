name: Update Homebrew Tap

# Keeps the SanditZZ/homebrew-tap cask in step with published releases, so
# `brew install sanditzz/tap/quotebar` always resolves to the latest version
# and `brew upgrade` does not offer a stale one.
#
# This does NOT deliver updates to installs already on someone's Mac — Sparkle
# does that (see RELEASING.md). This only keeps a *fresh* `brew install`
# current, and it commits straight to the tap's main branch: there is no review
# step because the tap has one maintainer, and the values it writes are read
# verbatim from the release that was just published in this repo, not invented.
#
# Requires two things that are NOT set up automatically:
#
#   1. The HOMEBREW_TAP_DEPLOY_KEY secret: the private half of an SSH deploy
#      key registered on SanditZZ/homebrew-tap with write access. The default
#      GITHUB_TOKEN cannot push to a different repository.
#
#      A deploy key rather than a personal access token, deliberately. A PAT
#      carrying contents:write can write to every repository the account owns,
#      so leaking one from CI costs the whole account; this key can write to
#      the tap and nothing else. It also does not expire, and needs no browser
#      step to create. Rotate by removing the key from the tap's Deploy keys
#      settings and repeating the steps in RELEASING.md.
#   2. A Casks/quotebar.rb file already in the tap. This workflow updates an
#      existing cask; it deliberately does not create one, because the initial
#      cask needs a human decision about name, description and dependencies.
#
# Without either, the job fails loudly and the release itself is unaffected.

on:
  workflow_call:
    inputs:
      release_tag:
        description: "Release tag to update the tap for, e.g. v0.2.0"
        required: true
        type: string

  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to (re)sync the tap to, e.g. v0.2.0"
        required: true
        type: string

concurrency:
  group: homebrew-tap
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-tap:
    name: Update the cask
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TAP_REPO: SanditZZ/homebrew-tap
      TAG: ${{ inputs.release_tag }}

    steps:
      - name: Fail early without a tap deploy key
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [ -z "${DEPLOY_KEY}" ]; then
            echo "::error::HOMEBREW_TAP_DEPLOY_KEY is not set. The tap cannot be updated. See RELEASING.md."
            exit 1
          fi

      - name: Read the release's checksum
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          gh release download "${TAG}" --repo "${{ github.repository }}" \
            --pattern "checksums-*.txt" --dir . --clobber

          SHA256="$(awk -v f="./QuoteBar-${VERSION}.dmg" '$2 == f {print $1}' "checksums-${VERSION}.txt")"

          if [ -z "${SHA256}" ]; then
            echo "::error::Could not find a checksum for QuoteBar-${VERSION}.dmg in checksums-${VERSION}.txt"
            exit 1
          fi

          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
          echo "::notice::${TAG} → version ${VERSION}, sha256 ${SHA256}"

      - name: Check out the tap
        uses: actions/checkout@v5
        with:
          repository: ${{ env.TAP_REPO }}
          # ssh-key rather than token: checkout configures SSH and sets the
          # remote to git@github.com, so the push below authenticates as the
          # deploy key.
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap

      - name: Update the cask
        id: update
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          set -euo pipefail
          CASK="tap/Casks/quotebar.rb"

          if [ ! -f "${CASK}" ]; then
            echo "::error::${CASK} not found. Add the cask to ${TAP_REPO} once by hand, then this workflow keeps it current. See RELEASING.md."
            exit 1
          fi

          sed -i \
            -e "s/^  version \".*\"/  version \"${VERSION}\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"${SHA256}\"/" \
            "${CASK}"

          grep -q "version \"${VERSION}\"" "${CASK}"
          grep -q "sha256 \"${SHA256}\"" "${CASK}"

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/quotebar.rb

          if git diff --staged --quiet; then
            echo "::notice::Cask already up to date"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Updated quotebar to ${VERSION}"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        if: steps.update.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: echo "::notice::sanditzz/homebrew-tap now serves quotebar ${VERSION}"
